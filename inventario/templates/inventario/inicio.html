{% extends 'inventario/dashboard_global.html' %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="dashboard-header animated-fade">
    <h2 style="color: #2c3e50; font-weight: 700; margin-bottom: 5px;">
        <i class="fas fa-chart-pie" style="color: var(--color-principal);"></i> Resumen de Operaciones - {{ canal }}
    </h2>
    <p style="color: #64748b; margin-top: 0;">Visualización en tiempo real del rendimiento y estado del inventario.</p>
</div>

<div class="chart-grid">
    <div class="chart-card animated-card" style="--delay: 0.1s;">
        <h3 class="chart-title">Distribución de Ventas</h3>
        <div class="chart-container">
            <canvas id="chartVentas"></canvas>
        </div>
    </div>

    <div class="chart-card animated-card" style="--delay: 0.3s;">
        <h3 class="chart-title">Top Categorías Globales</h3>
        <div class="chart-container">
            <canvas id="chartCategorias"></canvas>
        </div>
    </div>

    <div class="chart-card animated-card" style="--delay: 0.5s;">
        <h3 class="chart-title">Estado de Inventario (Percherón)</h3>
        <div class="chart-container">
            <canvas id="chartInventario"></canvas>
        </div>
    </div>
</div>

<style>
    /* ===============================
       ANIMACIONES DE ENTRADA
       =============================== */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animated-fade {
        animation: fadeInUp 0.6s ease-out forwards;
    }

    .animated-card {
        opacity: 0; /* Inicia invisible */
        animation: fadeInUp 0.7s ease-out forwards;
        animation-delay: var(--delay); /* Crea el efecto cascada */
    }

    /* ===============================
       ESTILOS DE LAS TARJETAS Y GRID
       =============================== */
    .chart-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
        margin-top: 30px;
    }

    .chart-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        border-top: 4px solid var(--color-principal);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .chart-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    }

    .chart-title {
        margin: 0 0 20px 0;
        color: #334155;
        font-size: 1.1rem;
        text-align: center;
        font-weight: 600;
    }

    .chart-container {
        position: relative;
        height: 250px;
        width: 100%;
        display: flex;
        justify-content: center;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Leemos el color de la plataforma actual (Amarillo en ML, Verde en Falabella, etc.)
        const colorPrincipal = getComputedStyle(document.documentElement).getPropertyValue('--color-principal').trim() || '#3498DB';
        
        // Configuración elegante compartida para los gráficos
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '75%', // Hace que el anillo (Doughnut) sea más delgado y elegante
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        padding: 20,
                        usePointStyle: true, // Bolitas en lugar de cuadrados en la leyenda
                        font: { family: "'Segoe UI', sans-serif", size: 12 }
                    }
                }
            },
            layout: { padding: 10 }
        };

        // --------------------------------------------------
        // GRÁFICO 1: VENTAS (Anillo)
        // --------------------------------------------------
        const ctxVentas = document.getElementById('chartVentas').getContext('2d');
        new Chart(ctxVentas, {
            type: 'doughnut',
            data: {
                labels: ['Completadas', 'En Proceso', 'Canceladas'],
                datasets: [{
                    data: [65, 25, 10], // Números de prueba temporal
                    backgroundColor: [colorPrincipal, '#cbd5e1', '#f87171'], // El color 1 siempre coincide con la plataforma
                    borderWidth: 0,
                    hoverOffset: 8
                }]
            },
            options: commonOptions
        });

        // --------------------------------------------------
        // GRÁFICO 2: CATEGORÍAS (Anillo)
        // --------------------------------------------------
        const ctxCat = document.getElementById('chartCategorias').getContext('2d');
        new Chart(ctxCat, {
            type: 'doughnut',
            data: {
                labels: ['Línea Blanca', 'Audio y Video', 'Pequeños Electros'],
                datasets: [{
                    data: [45, 30, 25],
                    backgroundColor: ['#8b5cf6', '#3b82f6', '#14b8a6'],
                    borderWidth: 0,
                    hoverOffset: 8
                }]
            },
            options: commonOptions
        });

        // --------------------------------------------------
        // GRÁFICO 3: INVENTARIO (Pastel sólido para contrastar)
        // --------------------------------------------------
        const ctxInv = document.getElementById('chartInventario').getContext('2d');
        new Chart(ctxInv, {
            type: 'pie', // Pie en lugar de Doughnut
            data: {
                labels: ['Stock Normal', 'Stock Bajo', 'Agotados'],
                datasets: [{
                    data: [50, 35, 15],
                    backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                    borderWidth: 0,
                    hoverOffset: 8
                }]
            },
            options: {
                ...commonOptions,
                cutout: '0%' // Lo vuelve sólido
            }
        });
    });
</script>
{% endblock %}
