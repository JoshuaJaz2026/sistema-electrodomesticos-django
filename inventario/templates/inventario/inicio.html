<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - {{ canal }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --color-principal: {{ request.session.color_actual|default:"#3498DB" }};
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: #f4f7f6; }
        
        /* Barra Lateral */
        .sidebar { width: 260px; background: #2c3e50; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; text-align: center; background: rgba(0,0,0,0.1); border-bottom: 2px solid var(--color-principal); }
        .sidebar-menu { flex: 1; padding: 10px 0; }
        .menu-item { 
            padding: 15px 25px; display: flex; align-items: center; 
            color: #bdc3c7; text-decoration: none; transition: 0.3s;
        }
        .menu-item:hover { background: #34495e; color: white; border-left: 4px solid var(--color-principal); }
        .menu-item i { margin-right: 15px; width: 20px; text-align: center; }
        
        /* Contenido Principal */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        header { 
            background: white; padding: 15px 30px; display: flex; 
            justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container { padding: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .btn-logout { background: #e74c3c; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas {{ request.session.icono_actual|default:'fa-globe' }} fa-2x"></i>
            <h3>{{ canal }}</h3>
        </div>
        <nav class="sidebar-menu">
            <a href="#" class="menu-item"><i class="fas fa-home"></i> Inicio</a>
            <a href="{% url 'inventario_global' %}" class="menu-item"><i class="fas fa-boxes"></i> Inventario Global</a>
            
            <hr style="border: 0.5px solid #3e4f5f; margin: 10px 20px;">
            
            <a href="{% url 'reporte_ventas' %}" class="menu-item"><i class="fas fa-chart-line"></i> Mis Reportes</a>
            <a href="{% url 'simulador_costos' %}" class="menu-item"><i class="fas fa-calculator"></i> Simulador de Costos</a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <span>Bienvenido, <strong>{{ user.username }}</strong></span>
            <a href="{% url 'logout' %}" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </header>

        <div class="container">
            <div class="card">
                <h1>Panel de Control: {{ canal }}</h1>
                <p>Selecciona una opción en el menú lateral para comenzar a trabajar.</p>
            </div>
        </div>
    </div>

</body>
</html>
