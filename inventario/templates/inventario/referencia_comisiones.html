{% extends 'inventario/dashboard_global.html' %}

{% block content %}
<div class="card" style="max-width: 900px; margin: auto; border-top: 4px solid var(--color-principal);">
    <form method="POST" action="{% url 'guardar_comisiones' %}">
        {% csrf_token %}
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #1e293b; text-transform: uppercase;">
                <i class="fas fa-list-ul" style="color: var(--color-principal);"></i> Referencia: MARCA Y CATEG
            </h2>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar categoría..." style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 200px;">
                <button type="submit" style="background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </div>
        
        <div style="overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px;">
            <table id="tablaComisiones" style="width: 100%; border-collapse: collapse; font-size: 0.9em;">
                <thead style="background: #f8fafc; position: sticky; top: 0;">
                    <tr>
                        <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; text-align: left;">SUB CATEGORÍA</th>
                        <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; text-align: left;">CATEGORÍA</th>
                        <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; text-align: center;">COMISIÓN (%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">Electrodomésticos</td>
                        <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">BATIDORA DE MANO</td>
                        <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center;">
                            <input type="number" name="comision_batidora" value="12.5" step="0.1" style="width: 70px; padding: 5px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">Línea Blanca</td>
                        <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">REFRIGERADORA</td>
                        <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center;">
                            <input type="number" name="comision_refri" value="9.5" step="0.1" style="width: 70px; padding: 5px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px;">
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
</div>

<script>
    function filtrarTabla() {
        const input = document.getElementById("buscador");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("tablaComisiones");
        const tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName("td")[1]; 
            if (td) {
                const txtValue = td.textContent || td.innerText;
                tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    }
</script>
{% endblock %}
