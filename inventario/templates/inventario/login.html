<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - {{ nombre_canal }}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-color: {{ color_principal }};
            --bg-main: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* ====== ANIMACIONES DE TRANSICIÓN DE PANTALLA ====== */
        body { 
            background-color: var(--bg-main); 
            background-image: radial-gradient(circle at top, color-mix(in srgb, var(--brand-color) 12%, transparent) 0%, transparent 50%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            
            /* Clases para el fade-in inicial */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        
        body.fade-in { opacity: 1; }
        body.fade-out { opacity: 0; }
        
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 20px 48px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid var(--brand-color); 
        }
        
        .login-header { text-align: center; margin-bottom: 30px; }
        
        .icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background-color: color-mix(in srgb, var(--brand-color) 12%, transparent);
            color: {% if nombre_canal == 'Tik tok' %}#2C3E50{% else %}var(--brand-color){% endif %};
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .login-header h2 { color: var(--text-main); font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        .login-header p { color: var(--text-muted); font-size: 15px; }
        
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; color: #334155; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .form-group input { 
            width: 100%; 
            padding: 12px 16px; 
            padding-right: 40px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 15px; 
            transition: all 0.3s;
        }
        
        .form-group input:focus { 
            border-color: var(--brand-color); 
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-color) 20%, transparent);
            outline: none; 
        }
        
        .btn-submit {
            width: 100%;
            background-color: var(--brand-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover { 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px color-mix(in srgb, var(--brand-color) 30%, transparent);
        }
        
        .error-message {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--brand-color); }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="icon-wrapper">
                <i class="{{ icono_canal }}"></i>
            </div>
            <h2>Ingreso a {{ nombre_canal }}</h2>
            <p>Bienvenido. Ingrese sus credenciales de acceso.</p>
        </div>

        {% if form.errors %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i> Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <!-- Agregamos el onsubmit para interceptar y animar el botón de ingresar -->
        <form method="post" action="{% url 'login' %}?canal={{ nombre_canal|urlencode }}" id="form-login" onsubmit="animarIngreso(event)">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Usuario</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username">
            </div>
            
            <div class="form-group">
                <label for="id_password">Contraseña</label>
                <div style="position: relative; width: 100%;">
                    <input type="password" name="password" autocomplete="current-password" required id="id_password">
                    <span onclick="togglePassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d; display: flex; align-items: center;" title="Mostrar/Ocultar contraseña">
                        <svg id="icono-ojo" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Ingresar al Sistema</button>
        </form>

        <a href="{% url 'selector' %}" class="back-link nav-link">
            <i class="fas fa-arrow-left"></i> Volver a plataformas
        </a>
    </div>

    <script>
        // Efecto de entrada al cargar
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add("fade-in");
        });

        // Efecto de salida al hacer clic en "Volver"
        const navLinks = document.querySelectorAll(".nav-link");
        navLinks.forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault();
                const targetUrl = this.href;
                document.body.classList.remove("fade-in");
                document.body.classList.add("fade-out");
                
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 400); 
            });
        });

        // Efecto de salida al enviar el formulario (Ingresar)
        function animarIngreso(event) {
            event.preventDefault(); 
            document.body.classList.remove("fade-in");
            document.body.classList.add("fade-out");
            
            setTimeout(() => {
                document.getElementById('form-login').submit(); 
            }, 400);
        }

        function togglePassword() {
            const passwordInput = document.getElementById('id_password');
            const iconoOjo = document.getElementById('icono-ojo');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                iconoOjo.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                passwordInput.type = 'password';
                iconoOjo.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }
    </script>
</body>
</html>
