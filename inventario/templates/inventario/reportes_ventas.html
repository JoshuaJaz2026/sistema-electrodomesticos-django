{% extends 'inventario/inicio.html' %}

{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2><i class="fas fa-chart-line"></i> Reporte de Ventas: {{ canal }}</h2>
        <button onclick="window.print()" style="background: var(--color-principal); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
            <i class="fas fa-print"></i> Exportar PDF
        </button>
    </div>
    <hr style="border: 0.5px solid #eee; margin: 15px 0;">

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
        <div style="background: #ebf5fb; padding: 15px; border-radius: 8px; border-left: 5px solid #3498db;">
            <span style="font-size: 0.8em; color: #555;">Ventas del Mes</span>
            <h3 style="margin: 5px 0;">S/ 0.00</h3>
        </div>
        <div style="background: #eafaf1; padding: 15px; border-radius: 8px; border-left: 5px solid #2ecc71;">
            <span style="font-size: 0.8em; color: #555;">Productos Vendidos</span>
            <h3 style="margin: 5px 0;">0</h3>
        </div>
        <div style="background: #fef9e7; padding: 15px; border-radius: 8px; border-left: 5px solid #f1c40f;">
            <span style="font-size: 0.8em; color: #555;">Ticket Promedio</span>
            <h3 style="margin: 5px 0;">S/ 0.00</h3>
        </div>
    </div>

    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background-color: var(--color-principal); color: white;">
                <th style="padding: 12px; text-align: left;">Fecha</th>
                <th style="padding: 12px; text-align: left;">Producto</th>
                <th style="padding: 12px; text-align: left;">Monto</th>
                <th style="padding: 12px; text-align: left;">Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="4" style="text-align: center; padding: 30px; color: #95a5a6;">
                    No hay ventas registradas para el canal <strong>{{ canal }}</strong> en este periodo.
                </td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
