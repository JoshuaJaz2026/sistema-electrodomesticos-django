{% extends 'inventario/dashboard_global.html' %}

{% block content %}
<div class="card" style="border-top: 4px solid var(--color-principal);">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: #2c3e50;">
            <i class="fas fa-sign-out-alt" style="color: var(--color-principal);"></i> Registro de Salidas - Percherón
        </h2>
        <span style="background-color: #fee2e2; color: #b91c1c; padding: 5px 15px; border-radius: 20px; font-size: 0.85em; font-weight: 600;">
            <i class="fas fa-truck-loading"></i> Despacho
        </span>
    </div>
    <hr style="border: 0.5px solid #eee; margin-bottom: 25px;">

    <form action="#" method="POST" style="max-width: 800px;">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            
            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Producto a Despachar</label>
                <select name="producto" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; background-color: white;" required>
                    <option value="" disabled selected>-- Seleccione un producto en stock --</option>
                    <option value="1">Refrigeradora LG 250L (Stock: 12)</option>
                    <option value="2">Lavadora Samsung 13kg (Stock: 5)</option>
                    <option value="3">Microondas Panasonic (Stock: 8)</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Cantidad a Retirar</label>
                <input type="number" name="cantidad" min="1" placeholder="Ej. 2" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem;" required>
            </div>

            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Cliente / Destino</label>
                <input type="text" name="destino" placeholder="Nombre del cliente o sucursal" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem;" required>
            </div>

            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Motivo de la Salida</label>
                <select name="motivo" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; background-color: white;" required>
                    <option value="Venta">Venta a Cliente</option>
                    <option value="Traslado">Traslado a Magazzino</option>
                    <option value="Garantia">Devolución / Garantía</option>
                    <option value="Merma">Merma / Dañado</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px;">
            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">N° de Boleta / Factura</label>
                <input type="text" name="comprobante" placeholder="Ej. B001-000458" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem;">
            </div>
            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Fecha de Salida</label>
                <input type="date" name="fecha" value="{% now 'Y-m-d' %}" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; color: #334155;" required>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; margin-bottom: 25px;">
            <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Notas adicionales</label>
            <textarea name="notas" rows="2" placeholder="Cualquier detalle importante sobre la salida..." style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; resize: vertical;"></textarea>
        </div>

        <div style="display: flex; gap: 15px; border-top: 1px solid #eee; padding-top: 20px;">
            <button type="submit" style="background-color: var(--color-principal); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;">
                <i class="fas fa-check-circle"></i> Confirmar Salida
            </button>
        </div>
    </form>

</div>
{% endblock %}
