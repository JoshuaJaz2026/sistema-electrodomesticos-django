<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando... - {{ canal }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --color-plataforma: {{ request.session.color_actual|default:"#3498DB" }};
        }
        
        /* ====== ANIMACIONES DE TRANSICIÓN DE PANTALLA ====== */
        body {
            margin: 0; padding: 0; height: 100vh; display: flex;
            justify-content: center; align-items: center;
            background: #2c3e50; font-family: 'Segoe UI', sans-serif;
            color: white; overflow: hidden;
            
            /* Inicialmente invisible para el Fade-In */
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        
        body.fade-in { opacity: 1; }
        body.fade-out { opacity: 0; }

        .loading-container { text-align: center; width: 300px; }
        
        .icon-box {
            font-size: 4em; 
            color: {% if canal == 'Tik tok' or canal == 'TikTok' %}white{% else %}var(--color-plataforma){% endif %};
            margin-bottom: 20px; animation: pulse 1.5s infinite;
        }

        .progress-bar-bg {
            background: rgba(255,255,255,0.1); height: 8px;
            border-radius: 10px; overflow: hidden; margin: 20px 0;
        }
        .progress-bar-fill {
            background: var(--color-plataforma); height: 100%;
            width: 0%; border-radius: 10px;
            box-shadow: 0 0 15px var(--color-plataforma);
            transition: width 0.05s linear;
        }
        
        .status-text { font-size: 0.9em; letter-spacing: 1px; opacity: 0.8; }
        .percentage { font-size: 1.5em; font-weight: bold; margin-top: 5px; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="loading-container">
        <div class="icon-box">
            <i class="{{ request.session.icono_actual|default:'fas fa-globe' }}"></i>
        </div>
        <div class="status-text">INICIANDO SISTEMA</div>
        
        <div style="font-weight: bold; color: {% if canal == 'Tik tok' or canal == 'TikTok' %}white{% else %}var(--color-plataforma){% endif %};">
            {{ canal }}
        </div>
        
        <div class="progress-bar-bg">
            <div id="bar" class="progress-bar-fill"></div>
        </div>
        
        <div id="percent" class="percentage">0%</div>
    </div>

    <script>
        // 1. Ejecutar el Fade-In al cargar la pantalla
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add("fade-in");
        });

        let progress = 0;
        const bar = document.getElementById('bar');
        const percentText = document.getElementById('percent');
        let saliendo = false; // Control para no repetir la animación de salida

        const interval = setInterval(() => {
            if (saliendo) return; // Si ya está saliendo, detenemos la cuenta
            
            progress += Math.floor(Math.random() * 5) + 1; 
            
            if (progress >= 100) {
                progress = 100;
                bar.style.width = progress + "%";
                percentText.innerText = progress + "%";
                clearInterval(interval);
                saliendo = true;
                
                // 2. Pausa para que el usuario vea el 100%
                setTimeout(() => {
                    // 3. Iniciamos el Fade-Out
                    document.body.classList.remove("fade-in");
                    document.body.classList.add("fade-out");
                    
                    // 4. Esperamos a que termine de oscurecerse (400ms) para ir al panel
                    setTimeout(() => {
                        window.location.href = "{% url 'inicio' %}";
                    }, 400);

                }, 400); 
                return;
            }
            
            bar.style.width = progress + "%";
            percentText.innerText = progress + "%";
        }, 50); 
    </script>
</body>
</html>
