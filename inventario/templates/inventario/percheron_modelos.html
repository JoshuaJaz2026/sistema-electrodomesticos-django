{% extends 'inventario/dashboard_global.html' %}

{% block content %}
<div class="card" style="border-top: 4px solid #3b82f6; padding: 20px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: #2c3e50;">
            <i class="fas fa-tags" style="color: #3b82f6;"></i> Directorio de Modelos
        </h2>
    </div>
    
    <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Agrupación de productos según familia y características técnicas.</p>

    <div style="overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; background: white; white-space: nowrap; font-size: 0.85em;">
            <thead>
                <tr style="background-color: #f8fafc; color: #334155; border-bottom: 2px solid #cbd5e1; text-transform: uppercase;">
                    <th style="padding: 12px; text-align: center;">#</th>
                    <th style="padding: 12px; text-align: left;">Marca</th>
                    <th style="padding: 12px; text-align: left;">Modelo General</th>
                    <th style="padding: 12px; text-align: left;">Categoría</th>
                    <th style="padding: 12px; text-align: center;">SKUs Vinculados</th>
                </tr>
            </thead>
            <tbody>
                <tr style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 12px; text-align: center; color: #94a3b8;">1</td>
                    <td style="padding: 12px; font-weight: bold;">SAMSUNG</td>
                    <td style="padding: 12px;">RT29K5710S8</td>
                    <td style="padding: 12px; color: #475569;">Refrigeración</td>
                    <td style="padding: 12px; text-align: center;"><span style="background: #e0f2fe; color: #0284c7; padding: 4px 8px; border-radius: 12px; font-weight: bold;">3 Variantes</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
