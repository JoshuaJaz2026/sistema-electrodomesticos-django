{% extends 'inventario/dashboard_global.html' %}

{% block content %}
<div class="card" style="border-top: 4px solid var(--color-principal);">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: #2c3e50;">
            <i class="fas fa-sign-in-alt" style="color: var(--color-principal);"></i> Registro de Ingresos - Percherón
        </h2>
        <span style="background-color: #e2e8f0; color: #475569; padding: 5px 15px; border-radius: 20px; font-size: 0.85em; font-weight: 600;">
            <i class="far fa-calendar-alt"></i> Hoy: {% now "d/m/Y" %}
        </span>
    </div>
    <hr style="border: 0.5px solid #eee; margin-bottom: 25px;">

    <form action="#" method="POST" style="max-width: 800px;">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            
            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Producto a Ingresar</label>
                <select name="producto" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; background-color: white;" required>
                    <option value="" disabled selected>-- Seleccione un producto --</option>
                    <option value="1">Refrigeradora LG 250L</option>
                    <option value="2">Lavadora Samsung 13kg</option>
                    <option value="3">Microondas Panasonic</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Cantidad Recibida</label>
                <input type="number" name="cantidad" min="1" placeholder="Ej. 10" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem;" required>
            </div>

            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Proveedor / Origen</label>
                <input type="text" name="proveedor" placeholder="Nombre del proveedor o traslado" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem;" required>
            </div>

            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Guía de Remisión / Factura</label>
                <input type="text" name="guia" placeholder="Ej. F001-004521" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem;">
            </div>
        </div>

        <div style="display: flex; flex-direction: column; margin-bottom: 25px;">
            <label style="font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.9em;">Observaciones (Opcional)</label>
            <textarea name="observaciones" rows="3" placeholder="Detalles sobre el estado de la mercadería..." style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; resize: vertical;"></textarea>
        </div>

        <div style="display: flex; gap: 15px; border-top: 1px solid #eee; padding-top: 20px;">
            <button type="submit" style="background-color: var(--color-principal); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;">
                <i class="fas fa-save"></i> Registrar Ingreso
            </button>
            <button type="reset" style="background-color: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 12px 25px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s;">
                Limpiar Formulario
            </button>
        </div>
    </form>

</div>
{% endblock %}
